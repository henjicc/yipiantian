name: Build Windows demo release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already recorded in Game/project.godot and release notes
        required: true
        default: '0.1.8'
        type: string

permissions:
  contents: write

concurrency:
  group: windows-demo-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Check release target
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a version such as 0.1.8.' }
          $tag = 'v' + $env:RELEASE_VERSION
          $head = @(git ls-remote origin refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or ($head[0] -split '\s+')[0] -ne $env:GITHUB_SHA) {
            throw 'The selected commit is no longer the current main branch.'
          }
          $existingTag = @(git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0 -or $existingTag.Count -ne 0) { throw "Release tag $tag already exists or could not be checked." }

      - name: Install pinned Godot editor and Windows export template
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath '.godot-version' -Raw).Trim()
          if ($version -ne '4.7.2-stable') { throw 'Update the pinned download hashes when changing Godot.' }
          $base = "https://github.com/godotengine/godot/releases/download/$version"
          $editorZip = Join-Path $env:RUNNER_TEMP "Godot_v${version}_win64.exe.zip"
          $templateZip = Join-Path $env:RUNNER_TEMP "Godot_v${version}_export_templates.tpz"
          $downloads = @(
            @{ url="$base/Godot_v${version}_win64.exe.zip"; path=$editorZip; sha='731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953' },
            @{ url="$base/Godot_v${version}_export_templates.tpz"; path=$templateZip; sha='f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011' }
          )
          foreach ($item in $downloads) {
            & curl.exe --fail --location --retry 3 --retry-delay 5 --output $item.path $item.url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $($item.url)" }
            if ((Get-FileHash -LiteralPath $item.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.sha) {
              throw "Checksum mismatch: $($item.path)"
            }
          }
          $editorDirectory = Join-Path $env:RUNNER_TEMP 'godot-editor'
          Expand-Archive -LiteralPath $editorZip -DestinationPath $editorDirectory
          $editor = @(Get-ChildItem -LiteralPath $editorDirectory -Recurse -File -Filter "Godot_v${version}_win64_console.exe")
          if ($editor.Count -ne 1) { throw 'Pinned Godot console executable was not found.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GODOT_EXE=$($editor[0].FullName)"
          $templateDirectory = Join-Path $env:APPDATA ('Godot/export_templates/' + $version.Replace('-', '.'))
          New-Item -ItemType Directory -Path $templateDirectory -Force | Out-Null
          $archive = [IO.Compression.ZipFile]::OpenRead($templateZip)
          try {
            foreach ($name in @('windows_release_x86_64.exe', 'version.txt')) {
              $matches = @($archive.Entries | Where-Object { $_.FullName -match ('(^|/)' + [regex]::Escape($name) + '$') })
              if ($matches.Count -ne 1) { throw "Expected one $name in the export templates archive." }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($matches[0], (Join-Path $templateDirectory $name), $true)
            }
          } finally { $archive.Dispose() }
          if ((Get-Content -LiteralPath (Join-Path $templateDirectory 'version.txt') -Raw).Trim() -ne $version.Replace('-', '.')) {
            throw 'Export template version does not match the editor.'
          }
          Remove-Item -LiteralPath $editorZip, $templateZip -Force

      - name: Build and audit release package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          & ./scripts/package-release.ps1 -Commit $env:GITHUB_SHA -Version $env:RELEASE_VERSION -GodotPath $env:GODOT_EXE -UseCurrentCheckout

      - name: Upload verified package to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = 'v' + $version
          $folder = Join-Path '.local/releases' ($version + '-' + $env:GITHUB_SHA.Substring(0, 8))
          $zip = Join-Path $folder ("我有一片田 Demo $version Windows.zip")
          $checksum = "$zip.sha256"
          $zipInfo = Get-Item -LiteralPath $zip
          if ($zipInfo.Length -ge 2GB) { throw 'GitHub release assets must be under 2 GiB each.' }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not ((Get-Content -LiteralPath $checksum -Raw).StartsWith($sha + '  '))) { throw 'ZIP checksum does not match.' }
          & gh release create $tag $zip $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Demo $version" --notes-file '发行材料/版本说明.txt' --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release with both assets.' }
          $release = (& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the draft release.' }
          $asset = @($release.assets | Where-Object { $_.name -eq $zipInfo.Name })
          if ($asset.Count -ne 1 -or $asset[0].size -ne $zipInfo.Length -or $asset[0].digest -ne "sha256:$sha") {
            throw 'GitHub ZIP asset size or digest does not match the local package; draft retained for inspection.'
          }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Package uploaded but release could not be published; inspect the draft.' }
          $published = (& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $published.draft) { throw 'Release publication could not be verified.' }
          Write-Output "RELEASE_PUBLISHED $($published.html_url) sha256=$sha"
